name: CI

# Läuft auf dem Forgejo-Runner "Swarm-CP" (Label swarm-manager, Docker-Socket
# ist eingehängt). Pushes auf jeden Branch decken auch Pull Requests aus diesem
# Repo ab, daher kein eigener pull_request-Trigger (sonst liefe alles doppelt).
on:
  push:
  workflow_dispatch:

# Das Standard-Image des Runners (docker:27-cli) ist Alpine ohne Bash.
# Forgejo nutzt sonst bash -e -o pipefail.
defaults:
  run:
    shell: sh

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, Tests, Build
    runs-on: swarm-manager
    container:
      image: node:22
    defaults:
      run:
        shell: sh
        working-directory: tasmota_manager
    env:
      CI: "true"
    steps:
      - name: Repository auschecken
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: pnpm installieren
        run: npm install -g pnpm@10

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: App-Image bauen
    needs: test
    runs-on: swarm-manager
    steps:
      - name: Checkout-Werkzeuge
        run: apk add --no-cache git nodejs

      - name: Repository auschecken
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Image bauen
        env:
          SHA: ${{ github.sha }}
        run: |
          set -eu
          tag="tasmota-manager:ci-$(printf '%s' "$SHA" | cut -c1-7)"
          docker build -t "$tag" tasmota_manager
          docker image inspect "$tag" >/dev/null
          # Nur ein Bautest: Image nicht auf dem Swarm-Manager liegen lassen.
          docker image rm "$tag" >/dev/null
